<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рандомайзер цветов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <ul>
            <li data-i18n="title"> Рандомайзер цветов </li>
            <li onclick="window.location.href='galeria.html'"> <img src="img/logo-meniu.png" width="20px"> </li>
        </ul>
    </nav>

        <h1 class="name" data-i18n="colorName"> Название цвета </h1>
        <div class="color-box"></div>
        
        <div class="color-codes">
            <div class="code-item">
                <span class="code-label" data-i18n="hex">HEX:</span>
                <span class="hex-code">#000000</span>
            </div>
            <div class="code-item">
                <span class="code-label" data-i18n="rgb">RGB:</span>
                <span class="rgb-code">rgb(0, 0, 0)</span>
            </div>
            <div class="code-item">
                <span class="code-label" data-i18n="hsl">HSL:</span>
                <span class="hsl-code">hsl(0, 0%, 0%)</span>
            </div>
        </div>
        
        <button class="button" data-i18n="button">тыкни</button>
    </div>

    <div id="language-selector" class="language-selector">
        <button class="lang-main-btn" title="Выберите язык">RU</button>
        <button class="lang-btn" data-lang="ru" title="Русский">RU</button>
        <button class="lang-btn" data-lang="ro" title="Română">RO</button>
        <button class="lang-btn" data-lang="en" title="English">EN</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
